name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Format Check
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "$out"
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Race Test
        run: CGO_ENABLED=1 go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o surituner ./cmd/surituner

      - name: Module Verify
        run: go mod verify

      - name: Shell Syntax
        run: bash -n scripts/*.sh

      - name: Fake CLI E2E
        run: |
          bin="$(mktemp)"
          go build -o "${bin}" ./cmd/surituner
          SURITUNER_BIN="${bin}" ./scripts/e2e_fake_cli.sh
